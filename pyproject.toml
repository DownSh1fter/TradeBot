[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-futures-bot"
version = "0.2.0"
description = "Experimental futures research, paper execution and guarded Bybit Demo trading"
requires-python = ">=3.11"
dependencies = ["ccxt>=4.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
