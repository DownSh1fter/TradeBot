[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-futures-bot"
version = "0.1.0"
description = "Paper-only futures strategy prototype for Binance and Bybit market data"
requires-python = ">=3.11"
dependencies = ["ccxt>=4.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
